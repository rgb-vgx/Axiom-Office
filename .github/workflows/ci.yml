name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Linux la nen tang chinh cua lan LibreOffice (docs/architecture/libreoffice.md): chay duoc ca test that voi soffice.
  # Khong con .NET o day: MCP server ban Linux la subcommand `mcp` cua chinh Agent Core (Go).
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Moi buoc test goi dich cua Makefile - Makefile la nguon duy nhat liet ke test (truoc day CI chep tay
      # danh sach node --test va bo sot test_pane_view/test_mini_view).
      - name: Unit test extension LibreOffice (khong can LibreOffice)
        run: make test-lo

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Cai dependencies JS (de lint + test add-in WPS)
        run: npm ci

      # test_wps_bridge_live.py can WPS that + Xvfb + oem.ini bat JsApiPlugin: chi chay o may dev.
      - name: Unit test add-in WPS (trinh cai + registry/vong poll + probe, khong can WPS)
        run: make test-wps

      - uses: actions/setup-go@v5
        with:
          go-version-file: core-go/go.mod
          cache-dependency-path: core-go/go.sum

      - name: Lint Go + Python (gofmt + vet + staticcheck + ruff)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.8.1
          python3 -m pip install "ruff==0.17.0"
          make lint

      - name: File sinh khong duoc lech nguon
        run: make check-gen

      # go vet da chay trong `make lint`. test-core build Core vao dist/core/ (core-build) - cac buoc sau dung lai.
      # Core sinh chinh no lam MCP server built-in "office" nen phan mcp chay duoc ca tren Linux.
      - name: Agent Core ban Go (go test + build + e2e day du)
        run: make test-go test-core

      - name: Cai dependencies cho bo test oracle
        run: |
          python3 -m pip install -r tests/oracle/word-mcp/requirements.txt \
            -r tests/oracle/excel-mcp/requirements.txt -r tests/oracle/ppt-mcp/requirements.txt

      - name: Bo test oracle (MCP Word/Excel/PowerPoint mau)
        run: make test-oracle

      # Hai bo e2e nay chay Core that qua HTTP (dong vai add-in bang poll/result + LLM gia) nhung
      # KHONG can WPS; dich Makefile la nguon duy nhat liet ke chung.
      - name: E2e kenh WPS + pane Ask AI (Core that, khong can WPS)
        run: make test-wps-e2e

      - name: MCP server ban Go (khong can app dang mo)
        env:
          AXIOM_MCP_ARGS: mcp all
        run: make test-mcp

      - name: Cai LibreOffice + Python UNO (+ xvfb cho phan giao dien)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice python3-uno xvfb
          soffice --version

      # install.sh tu choi chay khi thieu Python UNO (no dung unopkg that), nen buoc nay phai sau buoc cai tren.
      # `python3-uno` cua apt thuoc python HE THONG (/usr/bin/python3): actions/setup-python dat mot ban 3.12 khac
      # len truoc trong PATH, ban do khong thay /usr/lib/python3/dist-packages nen `python3 -c 'import uno'` that
      # bai (lan chay 38155510443). Chay bang python he thong - dung nhu may dev, noi moi thu deu la python he thong.
      - name: Trinh cai Linux (install.sh, HOME tam + unopkg gia)
        run: PATH=/usr/bin:$PATH python3 tests/linux/test_install_sh.py

      - name: Cai extension + test moi lenh bridge tren LibreOffice that
        # Chua chay duoc tren runner: `unopkg add` sap (std::bad_alloc trong cpp_uno) ngay ca voi profile moi, trong
        # khi cung LibreOffice 24.2 tren Ubuntu 24.04 o may dev chay binh thuong. Test LibreOffice that chay o may
        # dev (tests/live/*.py); buoc nay giu lai de xem log, khong lam do ca job.
        continue-on-error: true
        run: |
          bash scripts/libreoffice.sh install
          bash scripts/libreoffice.sh status
          python3 tests/live/test_live_libreoffice.py

      - name: Wizard thiet lap (dialog that, profile rieng, LLM gia - qua Xvfb)
        continue-on-error: true   # can extension da cai o buoc tren (xem ghi chu o do)
        run: |
          sudo apt-get install -y --no-install-recommends xdotool
          xvfb-run -a python3 tests/live/test_setup_wizard.py

      - name: MCP + tool live (LibreOffice dang mo)
        continue-on-error: true   # can extension da cai (xem ghi chu buoc "Cai extension")
        env:
          AXIOM_MCP_ARGS: mcp all
        run: |
          setsid soffice --headless --calc --norestore >/tmp/soffice.out 2>&1 </dev/null &
          for _ in $(seq 40); do curl -s --max-time 1 http://127.0.0.1:47852/health >/dev/null && break; sleep 1; done
          python3 tests/mcp-host/test_mcp_portable.py "$PWD/dist/core/axiom-core" --live

      - name: Dong goi tarball (Core + MCP + oxt) + soi noi dung
        run: |
          make test-package
          bash scripts/linux/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: axiom-office-linux-x64
          path: dist/axiom-office-linux-x64-*.tar.gz
          if-no-files-found: error

  # Windows: add-in COM (net48) + MCP server C# trong AxiomOffice.Host.exe. Khong co Office/WPS trong
  # runner nen chi chay phan khong can app: unit test, Agent Core, build net48 va bo test MCP portable.
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v5
        with:
          go-version-file: core-go/go.mod
          cache-dependency-path: core-go/go.sum

      - name: Agent Core ban Go (go test)
        working-directory: core-go
        run: go test ./...

      # Goi CHINH build.ps1 (tim csc bang vswhere, build add-in + Host + Core Go, chep skills) thay vi chep tay
      # lenh csc: truoc 24/10/2026 hai noi giu hai bo tham so rieng va lech nhau. Runner sach nen khong co app
      # nao giu DLL.
      - name: Build add-in + Host (net48) + Agent Core bang scripts/build.ps1
        shell: pwsh
        run: |
          & .\scripts\build.ps1
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 failed" }
          foreach ($f in "AxiomOffice.dll", "AxiomOffice.Host.exe", "AxiomOffice.Core.exe") {
            if (-not (Test-Path "src\AxiomOffice\bin\Release\$f")) { throw "thieu $f sau build.ps1" }
          }

      # SAU build: test_catalog_matches_csharp so registry Python voi `AxiomOffice.Host.exe commands --json` -
      # truoc day buoc nay chay truoc khi build nen test do luon bi skip tren CI.
      - name: Unit test extension LibreOffice (kem doi chieu registry C#)
        run: python -m unittest discover -s tests/lo -v

      # Cac buoc nay truoc day chi co o job linux, nen loi C#/JS chi bi bat muon (hoac khong bi bat) tren Windows.
      - name: File sinh khong duoc lech nguon + i18n add-in
        run: |
          python scripts/generate_setup_catalog.py --check
          python scripts/generate_mcp_commands.py --check
          python scripts/check_version.py
          python scripts/check_i18n.py

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Lint JS + unit test add-in WPS (Node)
        shell: pwsh
        env:
          # Test Node goi Python de lay registry/theme; Windows chi co `python`, khong co `python3`.
          PYTHON: python
        run: |
          npm ci
          npx --no-install eslint .
          if ($LASTEXITCODE -ne 0) { throw "eslint failed" }
          node --test tests/wps/test_addin_fake.mjs tests/wps/test_addin.mjs tests/wps/test_addin_et.mjs `
            tests/wps/test_addin_wpp.mjs tests/wps/test_addin_writer.mjs tests/wps/test_probe.mjs tests/wps/test_pane.mjs `
            tests/wps/test_pane_theme.mjs tests/wps/test_pane_view.mjs tests/wps/test_mini_view.mjs
          if ($LASTEXITCODE -ne 0) { throw "WPS node tests failed" }

      - name: Agent Core ban Go (e2e day du tren Windows)
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "gocore"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Set-Location core-go
          go build -trimpath -ldflags "-s -w" -o "$stage\axiom-core.exe" ./cmd/axiom-core
          Set-Location ..
          Copy-Item -Recurse skills $stage
          # KHONG copy AxiomOffice.Host.exe vao day nua: server MCP built-in "office" bay gio la chinh
          # binary nay chay subcommand `mcp`. Thieu Host.exe ma e2e van xanh tuc la Core that su tu dung.
          $env:AXIOM_E2E_CORE_EXE = Join-Path $stage "axiom-core.exe"
          python tests/core/test_core_e2e.py
          # MCP server ban Windows (khong can app): cung binary Go, chay thang - khong qua Host.exe.
          python tests/mcp-host/test_mcp_portable.py "$stage\axiom-core.exe"
