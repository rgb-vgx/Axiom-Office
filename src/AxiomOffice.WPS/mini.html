<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Sửa bằng AI</title>
<!--
  Khung chat mini canh doan boi den (docs/ribbon-ui.md, "Trong khung chat"). Mo bang Application.ShowDialog tu menu
  chuot phai (main.js: openMini): "Sua bang AI > Trau chuot" mo ra va chay muc do ngay (?quick=polish); "Hoi AI ve
  doan nay" mo ra trong, cho chon chip hoac go yeu cau. Go them ("ngan hon nua") la luot tiep trong CUNG hoi thoai.

  Logic dung chung pane-core.js voi khung chat lon (gui, huy, hoan tac, dich loi). Khac duy nhat: create({
  requireSelection: true }) - moi luot deu bat buoc co doan boi den, khong co thi Core dung ngay (kind "selection"),
  de mot cau go tay khong bi hieu thanh sua CA tai lieu.

  :root duoi day CHEP NGUYEN tu pane.html - spec tests/wps/test_mini_view.mjs bat hai ban phai giong het.
  ES5 only (CEF Chrome 87).
-->
<script src="pane-core.js"></script>
<style>
:root{
  --axiom-pane-bg:#ffffff;
  --axiom-divider:#e5e7eb;
  --axiom-text-primary:#111827;
  --axiom-text-secondary:#4b5563;
  --axiom-text-muted:#6b7280;
  --axiom-ai-bg:#f9fafb;
  --axiom-ai-border:#e5e7eb;
  --axiom-user-bg:#d6e8f7;
  --axiom-user-fg:#0c3b5e;
  --axiom-accent:#0f6cbd;
  --axiom-accent-fg:#0f6cbd;
  --axiom-action-bg:#0f6cbd;
  --axiom-action-hover:#115ea3;
  --axiom-on-action:#ffffff;
  --axiom-disabled-bg:#f3f4f6;
  --axiom-disabled-fg:#9ca3af;
  --axiom-input-border:#8c93a0;
  --axiom-focus:#0f6cbd;
  --axiom-chip-border:#b4d6fa;
  --axiom-chip-hover:#eff6fc;
  --axiom-chip-fg:#115ea3;
  --axiom-danger:#dc2626;
  --axiom-danger-fg:#b91c1c;
  --axiom-danger-bg:#fef2f2;
  --axiom-danger-border:#fecaca;
  --axiom-success:#047857;
  --axiom-pad-x:12px;
  --axiom-gap-message:12px;
  --axiom-gap-before-tools:8px;
  --axiom-gap-tool-line:2px;
  --axiom-gap-chip:6px;
  --axiom-radius-bubble:10px;
  --axiom-radius-control:8px;
  --axiom-radius-composer:10px;
  --axiom-bubble-pad-x:12px;
  --axiom-bubble-pad-y:8px;
  --axiom-bubble-max-user:80%;
  --axiom-bubble-max-ai:92%;
  --axiom-header-h:48px;
  --axiom-footer-h:28px;
  --axiom-composer-h:98px;
  --axiom-send-w:64px;
  --axiom-send-h:30px;
  --axiom-chip-h:32px;
  --axiom-tool-row-h:20px;
  --axiom-icon:12px;
  --axiom-scroll-w:12px;
  --axiom-size-title:10pt;
  --axiom-size-empty-title:11pt;
  --axiom-size-body:9.5pt;
  --axiom-size-small:9pt;
  --axiom-size-tool:8.5pt;
  --axiom-size-tool-id:8pt;
  --axiom-size-caption:8.25pt;
}
html,
body {
  height: 100%;
}
body {
  margin: 0;
  padding: 0;
  background: var(--axiom-pane-bg);
  color: var(--axiom-text-primary);
  font-family: system-ui,"Segoe UI","Noto Sans",sans-serif;
  font-size: var(--axiom-size-body);
}
#mini {
  display: flex;
  flex-direction: column;
  height: 100vh;
}
#miniHeader {
  display: flex;
  align-items: center;
  gap: var(--axiom-gap-chip);
  padding: 10px var(--axiom-pad-x) 6px var(--axiom-pad-x);
}
.dot {
  width: 8px;
  height: 8px;
  min-width: 8px;
  border-radius: 50%;
  background: var(--axiom-accent);
}
#miniTitle {
  font-size: var(--axiom-size-title);
  font-weight: 600;
}
#miniModel {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  text-align: right;
  font-size: var(--axiom-size-caption);
  color: var(--axiom-text-muted);
}
#miniBody {
  flex: 1;
  overflow-y: auto;
  padding: 4px var(--axiom-pad-x) 8px var(--axiom-pad-x);
}
.miniHint {
  margin: 4px 0 10px 0;
  font-size: var(--axiom-size-small);
  color: var(--axiom-text-secondary);
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: var(--axiom-gap-chip);
}
.chip {
  height: 28px;
  padding: 0 10px;
  border: 1px solid var(--axiom-chip-border);
  border-radius: 14px;
  background: var(--axiom-pane-bg);
  color: var(--axiom-chip-fg);
  font-family: system-ui,"Segoe UI","Noto Sans",sans-serif;
  font-size: var(--axiom-size-small);
  cursor: pointer;
  transition: background-color 200ms ease, border-color 200ms ease;
}
.chip:hover {
  background: var(--axiom-chip-hover);
}
.chip:focus-visible {
  outline: 2px solid var(--axiom-focus);
  outline-offset: 1px;
}
.you {
  align-self: flex-end;
  margin: 6px 0 6px auto;
  max-width: var(--axiom-bubble-max-user);
  width: fit-content;
  padding: 4px 10px;
  border-radius: var(--axiom-radius-bubble);
  background: var(--axiom-user-bg);
  color: var(--axiom-user-fg);
  font-size: var(--axiom-size-small);
  white-space: pre-wrap;
}
.step {
  min-height: var(--axiom-tool-row-h);
  font-size: var(--axiom-size-tool);
  color: var(--axiom-text-secondary);
}
.stepOk {
  color: var(--axiom-success);
}
.stepFail {
  color: var(--axiom-danger-fg);
}
.progress {
  font-size: var(--axiom-size-tool);
  color: var(--axiom-text-muted);
}
.reply {
  margin: 6px 0;
  line-height: 1.5;
  white-space: pre-wrap;
}
.info {
  margin: 6px 0;
  font-size: var(--axiom-size-small);
  color: var(--axiom-text-secondary);
}
.error {
  margin: 6px 0;
  padding: 6px 10px;
  border: 1px solid var(--axiom-danger-border);
  border-radius: var(--axiom-radius-control);
  background: var(--axiom-danger-bg);
  color: var(--axiom-danger-fg);
  font-size: var(--axiom-size-small);
}
.confirm {
  margin: 6px 0;
  padding: 8px 10px;
  border: 1px solid var(--axiom-divider);
  border-radius: var(--axiom-radius-control);
  font-size: var(--axiom-size-small);
}
.confirm .row {
  display: flex;
  gap: var(--axiom-gap-chip);
  margin-top: 6px;
}
#miniComposer {
  display: flex;
  align-items: flex-end;
  gap: var(--axiom-gap-chip);
  margin: 0 var(--axiom-pad-x);
  padding: 6px 6px 6px 10px;
  border: 1px solid var(--axiom-input-border);
  border-radius: var(--axiom-radius-composer);
  transition: border-color 200ms ease;
}
#miniComposer:focus-within {
  border-color: var(--axiom-focus);
}
#miniInput {
  flex: 1;
  min-width: 0;
  border: none;
  outline: none;
  resize: none;
  background: transparent;
  color: var(--axiom-text-primary);
  font-family: system-ui,"Segoe UI","Noto Sans",sans-serif;
  font-size: var(--axiom-size-body);
}
.btnPrimary {
  min-width: var(--axiom-send-w);
  height: var(--axiom-send-h);
  border: none;
  border-radius: var(--axiom-radius-control);
  background: var(--axiom-action-bg);
  color: var(--axiom-on-action);
  font-family: system-ui,"Segoe UI","Noto Sans",sans-serif;
  font-size: var(--axiom-size-small);
  cursor: pointer;
  transition: background-color 200ms ease;
}
.btnPrimary:hover {
  background: var(--axiom-action-hover);
}
.btnPrimary:disabled {
  background: var(--axiom-disabled-bg);
  color: var(--axiom-disabled-fg);
  cursor: default;
}
.btnPrimary:focus-visible,
.link:focus-visible {
  outline: 2px solid var(--axiom-focus);
  outline-offset: 1px;
}
#miniFooter {
  display: flex;
  align-items: center;
  gap: var(--axiom-gap-chip);
  height: var(--axiom-footer-h);
  padding: 2px var(--axiom-pad-x) 4px var(--axiom-pad-x);
}
#miniStatus {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
  font-size: var(--axiom-size-caption);
  color: var(--axiom-text-muted);
}
.link {
  background: transparent;
  border: none;
  padding: 0 4px;
  color: var(--axiom-accent-fg);
  font-family: system-ui,"Segoe UI","Noto Sans",sans-serif;
  font-size: var(--axiom-size-caption);
  cursor: pointer;
  transition: color 200ms ease;
}
.link:hover {
  color: var(--axiom-action-hover);
  text-decoration: underline;
}
.link[hidden],
.chips[hidden] {
  display: none;
}
@media (prefers-reduced-motion: reduce) {
  .chip, .btnPrimary, .link, #miniComposer {
    transition: none;
  }
}
</style>
</head>
<body>
<div id="mini">
  <header id="miniHeader">
    <span class="dot" aria-hidden="true"></span>
    <span id="miniTitle">Sửa bằng AI</span>
    <span id="miniModel"></span>
  </header>
  <main id="miniBody" role="log" aria-live="polite" aria-label="Kết quả"></main>
  <div id="miniComposer">
    <textarea id="miniInput" rows="1" aria-label="Yêu cầu cho đoạn đang bôi đen" placeholder="Yêu cầu cho đoạn đang bôi đen…"></textarea>
    <button id="miniSend" class="btnPrimary" type="button" data-act="send" title="Enter để gửi · Shift+Enter xuống dòng">Gửi</button>
  </div>
  <footer id="miniFooter">
    <span id="miniStatus">Sẵn sàng</span>
    <button id="miniUndo" class="link" type="button" data-act="undo" hidden>Hoàn tác</button>
    <button id="miniStop" class="link" type="button" data-act="stop" hidden>Dừng</button>
    <button id="miniClose" class="link" type="button" data-act="close">Đóng</button>
  </footer>
</div>
<script>
(function () {
  "use strict";

  function $(id) {
    try { return document.getElementById(id); } catch (e) { return null; }
  }

  function textOf(value) {
    return String(value === undefined || value === null ? "" : value);
  }

  function trimText(value) {
    return textOf(value).replace(/^\s+|\s+$/g, "");
  }

  function clearNode(el) {
    try { while (el.firstChild) { el.removeChild(el.firstChild); } } catch (e) {}
  }

  function make(tag, className, text) {
    var el = document.createElement(tag);
    try { if (className) { el.className = className; } } catch (e) {}
    if (text !== undefined && text !== null) {
      try { el.appendChild(document.createTextNode(String(text))); } catch (e2) {}
    }
    return el;
  }

  // ?quick=<id>: muc chon tu menu chuot phai - chay ngay khi mo. Khong co = "Hoi AI ve doan nay" (cho chon/go).
  var QUICK = "";
  try {
    var mq = /[?&]quick=([a-z]+)/.exec(textOf(window.location && window.location.search));
    if (mq) { QUICK = mq[1]; }
  } catch (e0) { QUICK = ""; }

  // Cung cach tinh duong /wps/v1/ voi pane.html: trang nam o /wps/addin/, API o /wps/v1/.
  function baseUrl() {
    var href = "";
    try { href = (window.location && window.location.href) || ""; } catch (e) { href = ""; }
    var clean = String(href).split(String.fromCharCode(35))[0].split("?")[0];
    var marker = "/wps/addin/";
    var idx = clean.indexOf(marker);
    if (idx >= 0) { return clean.substring(0, idx) + "/wps/v1/"; }
    return "../v1/";
  }

  var Core = window.AxiomPaneCore;
  var ctl = null;
  try {
    ctl = Core.create({
      fetch: window.fetch,
      EventSource: window.EventSource,
      base: baseUrl(),
      kind: "wps",
      requireSelection: true,
      onChange: render
    });
  } catch (e1) { ctl = null; }

  function stepRow(step, running) {
    var label = "";
    try { label = Core.labelFor(step.action); } catch (e) { label = textOf(step.action); }
    var mark = "…";
    var cls = "step";
    if (step.ok === true) { mark = "✓"; cls = "step stepOk"; }
    else if (step.ok === false) { mark = "✕"; cls = "step stepFail"; }
    else if (!running) { mark = "·"; }
    var text = mark + " " + label;
    if (step.ok === false && step.error) {
      try { text += " — " + Core.errorSummary(step.error); } catch (e2) {}
    }
    return make("div", cls, text);
  }

  function renderBody(state) {
    var body = $("miniBody");
    if (!body) { return; }
    clearNode(body);
    var messages = state.messages || [];
    if (!messages.length) {
      body.appendChild(make("div", "miniHint", "Chọn việc cần làm với đoạn đang bôi đen, hoặc gõ yêu cầu bên dưới."));
      var chips = make("div", "chips");
      var list = state.quickActions || [];
      for (var i = 0; i < list.length; i++) {
        var chip = make("button", "chip", list[i].label);
        try {
          chip.type = "button";
          chip.setAttribute("data-act", "quick");
          chip.setAttribute("data-value", list[i].id);
        } catch (e) {}
        chips.appendChild(chip);
      }
      body.appendChild(chips);
      return;
    }
    // Cac buoc cua luot dang chay/vua xong nam ngay sau tin nhan cuoi cua nguoi dung.
    var lastUser = -1;
    for (var k = 0; k < messages.length; k++) { if (messages[k].role === "user") { lastUser = k; } }
    for (var j = 0; j < messages.length; j++) {
      var m = messages[j];
      if (m.role === "user") { body.appendChild(make("div", "you", m.text)); }
      else if (m.role === "assistant") {
        var reply = m.text;
        try { reply = Core.plainReply(m.text); } catch (e3) {}
        body.appendChild(make("div", "reply", reply));
      } else if (m.role === "error") { body.appendChild(make("div", "error", m.text)); }
      else { body.appendChild(make("div", "info", m.text)); }
      if (j === lastUser) {
        var steps = state.steps || [];
        for (var s = 0; s < steps.length; s++) { body.appendChild(stepRow(steps[s], state.running)); }
        if (state.running && state.progress) { body.appendChild(make("div", "progress", state.progress)); }
      }
    }
    if (state.confirmation) {
      var card = make("div", "confirm", state.confirmation.reason || "AI cần bạn xác nhận trước khi làm tiếp.");
      var row = make("div", "row");
      var yes = make("button", "btnPrimary", "Đồng ý");
      var no = make("button", "link", "Không");
      try { yes.type = "button"; yes.setAttribute("data-act", "approve"); } catch (e4) {}
      try { no.type = "button"; no.setAttribute("data-act", "deny"); } catch (e5) {}
      row.appendChild(yes);
      row.appendChild(no);
      card.appendChild(row);
      body.appendChild(card);
    }
    try { body.scrollTop = body.scrollHeight; } catch (e6) {}
  }

  function render(state) {
    try {
      state = state || {};
      renderBody(state);
      var model = $("miniModel");
      if (model) { clearNode(model); model.appendChild(document.createTextNode(trimText(state.model))); }
      var status = $("miniStatus");
      if (status) {
        var text = state.running ? (state.status || "Đang chạy…") : "";
        if (!state.running) { try { text = Core.summary(state); } catch (e) { text = "Sẵn sàng"; } }
        clearNode(status);
        status.appendChild(document.createTextNode(text));
      }
      var undo = $("miniUndo");
      if (undo) {
        if (state.canUndo) { undo.removeAttribute("hidden"); } else { undo.setAttribute("hidden", "hidden"); }
      }
      var stop = $("miniStop");
      if (stop) {
        if (state.running) { stop.removeAttribute("hidden"); } else { stop.setAttribute("hidden", "hidden"); }
      }
      updateSend(state);
    } catch (e2) {}
  }

  function updateSend(state) {
    var send = $("miniSend");
    var input = $("miniInput");
    if (!send) { return; }
    var empty = !trimText(input ? input.value : "");
    try { send.disabled = !!(state && state.running) || empty; } catch (e) {}
  }

  function current() {
    try { return ctl ? ctl.getState() : {}; } catch (e) { return {}; }
  }

  function doSend() {
    var input = $("miniInput");
    var text = trimText(input ? input.value : "");
    if (!text || !ctl || current().running) { return; }
    try { input.value = ""; } catch (e) {}
    ctl.send(text);
  }

  // Dong: ShowDialog cua WPS la mot cua so CEF rieng - window.close() dong no. Dang chay thi dung luot truoc, de khong
  // con luot chay ngam sua tai lieu sau khi nguoi dung da dong khung.
  function closeMini() {
    try { if (ctl && current().running) { ctl.stop(); } } catch (e) {}
    try { window.close(); } catch (e2) {}
  }

  function actOf(el) {
    try {
      while (el && el !== document.body) {
        if (el.getAttribute) {
          var act = el.getAttribute("data-act");
          if (act) { return { act: act, value: el.getAttribute("data-value") || "" }; }
        }
        el = el.parentNode;
      }
    } catch (e) {}
    return null;
  }

  function onAction(found) {
    if (!ctl) { return; }
    if (found.act === "send") { doSend(); }
    else if (found.act === "quick") { ctl.quick(found.value); }
    else if (found.act === "undo") { ctl.undoLastTurn(); }
    else if (found.act === "stop") { ctl.stop(); }
    else if (found.act === "approve") { ctl.confirm(true); }
    else if (found.act === "deny") { ctl.confirm(false); }
    else if (found.act === "close") { closeMini(); }
  }

  try {
    var page = document.body;
    page.addEventListener("click", function (ev) {
      var found = null;
      try { found = actOf(ev.target || ev.srcElement); } catch (e) { found = null; }
      if (found) { onAction(found); }
    });
    page.addEventListener("keydown", function (ev) {
      var code = ev.keyCode || ev.which;
      var target = ev.target || ev.srcElement;
      if (code === 27) { closeMini(); return; }
      if (code === 13 && !ev.shiftKey && target && target.id === "miniInput") {
        try { ev.preventDefault(); } catch (e) {}
        doSend();
      }
    });
    var input = $("miniInput");
    if (input) { input.addEventListener("input", function () { updateSend(current()); }); }
  } catch (e7) {}

  render({ messages: [], running: false, steps: [] });
  if (ctl) {
    // Doi danh sach muc ve truoc: chip can nhan, va bong bong cua ?quick= hien "Trau chuot" chu khong phai "polish".
    var go = function () {
      if (QUICK) { ctl.quick(QUICK); }
      else { try { $("miniInput").focus(); } catch (e) {} }
    };
    try { ctl.loadQuickActions().then(go, go); } catch (e8) { go(); }
  }
})();
</script>
</body>
</html>
